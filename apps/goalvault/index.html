<!DOCTYPE html>
<html lang="vi" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Goalvault | Mục tiêu tài chính</title>
  <meta name="description" content="Goalvault — theo dõi mục tiêu tài chính cá nhân.">
  <meta name="theme-color" content="#059669">
  <link rel="icon" href="https://avatars.githubusercontent.com/u/45620091?v=4">
  <script>
    try {
      var theme = localStorage.getItem('goalvault.theme') || 'system';
      if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      document.documentElement.lang = localStorage.getItem('goalvault.lang') || 'vi';
    } catch (e) { }
  </script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Be Vietnam Pro', 'ui-sans-serif', 'system-ui'] },
          colors: {
            brand: {
              50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399',
              500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b',
            },
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 p-4 shadow-[0_1px_2px_rgba(15,23,42,0.04)]; }
      .card-hover { @apply transition-[box-shadow,border-color] duration-200 hover:shadow-md hover:border-slate-300 dark:hover:border-slate-700; }
      .section-title { @apply text-base font-bold tracking-tight; }
      .muted { @apply text-slate-500 dark:text-slate-400; }
      .hero { @apply bg-gradient-to-br from-brand-700 via-brand-700 to-teal-800 dark:from-brand-800 dark:via-teal-900 dark:to-slate-900; }
      .tag-group { @apply md:col-span-2 space-y-3 rounded-2xl bg-slate-100/70 dark:bg-slate-800/40 p-3; }
      .btn { @apply inline-flex items-center justify-center gap-2 px-4 h-11 rounded-xl font-semibold text-sm transition active:scale-[.98] disabled:opacity-50; }
      .btn-sm { @apply h-9 px-3; }
      .btn-primary { @apply bg-brand-600 hover:bg-brand-700 text-white shadow-lg shadow-brand-600/20; }
      .btn-ghost { @apply bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-200; }
      .btn-danger { @apply bg-rose-600 hover:bg-rose-700 text-white; }
      .icon-btn { @apply inline-flex items-center justify-center w-11 h-11 shrink-0 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-700 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200 transition-colors duration-150; }
      .input { @apply w-full rounded-xl border border-slate-200 bg-white px-3 h-11 text-base outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 disabled:opacity-50 dark:bg-slate-950 dark:border-slate-700; }
      textarea.input { @apply h-auto py-2; }
      .label { @apply text-sm font-medium text-slate-600 dark:text-slate-300; }
      .chip { @apply inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold whitespace-nowrap; }
      .modal-overlay { @apply fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end md:items-center justify-center md:p-4; }
      .modal-panel { @apply w-full md:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl md:rounded-3xl bg-white dark:bg-slate-900 p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] shadow-2xl; }
      .toast { @apply pointer-events-auto rounded-xl px-4 py-3 text-sm font-medium shadow-lg text-white bg-slate-800; }
      .toast-error { @apply bg-rose-600; }
    }
  </style>
  <link rel="stylesheet" href="css/style.css">
  <!-- Icons & libraries -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
</head>

<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased">
  <div id="app" class="min-h-full">
    <div class="min-h-screen flex items-center justify-center text-slate-400">Goalvault…</div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed top-4 inset-x-0 z-[60] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>
  <script type="module" src="js/app.js"></script>
</body>

</html>
